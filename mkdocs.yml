site_name: IUP Steamshop Internal Repository
site_description: Central hub for machine SOPs, shop guidelines, and active student projects.

theme:
  name: material
  logo: assets/logo.png
  palette:
    primary: red
    accent: red

copyright: Copyright &copy; 2026 IUP Steamshop

extra_css:
  - stylesheets/extra.css

# Suppress warnings for manual.docx files (binary assets MkDocs can't validate)
validation:
  links:
    not_found: ignore

